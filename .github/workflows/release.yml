name: release

# One release per tag. Nothing here runs on a push to a branch - that is what
# ci.yml is for.
#
#   git tag v0.5.1 && git push origin v0.5.1
#
# produces a GitHub Release with three files:
#
#   sqt_0.5.1_amd64.deb            debian/ubuntu package, needs root to install
#   sqt-0.5.1-x86_64.AppImage      portable linux, chmod +x and run
#   sqt-0.5.1-windows-x64.zip      portable windows, unpack and run sqt.exe
#
# workflow_dispatch builds the same three without publishing anything, which is
# the way to try a change to this file before spending a tag on it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    # Stated once here rather than per step. A job with `container:` gets `sh`,
    # and /bin/sh in the image is dash: `set -o pipefail` is a bash builtin, so
    # dash quits on the first line before the step does anything at all.
    shell: bash

env:
  # Qt for the two self-contained builds (windows zip, AppImage). An LTS, not
  # the newest: these are binary releases and a settled base matters more.
  # The deb uses the distribution's Qt instead - see the linux-deb job.
  QT_VERSION: 6.8.3

jobs:
  # The version every job builds with, worked out once. For a tag it is the tag
  # without its leading v; for a manual run it is a placeholder, since there is
  # nothing to publish anyway.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          else
            version="0.0.0-dev"
            release=false
          fi
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) echo "tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR[.PATCH]" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "building $version (release=$release)"

  # ---------------------------------------------------------------- deb ------
  # Built in a container rather than on the ubuntu-22.04 runner image: runner
  # images are retired on GitHub's schedule, a container image is not, and the
  # container pins the glibc and Qt the package is built against.
  #
  # Qt comes from the distribution here on purpose. A package that depends on a
  # Qt no apt repository carries would either have to bundle it (which is not
  # what a deb is for) or refuse to install.
  linux-deb:
    needs: version
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev file ca-certificates git \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            libgl1-mesa-dev libpq-dev unixodbc-dev libssl-dev

      - uses: actions/checkout@v5

      - name: configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSQT_VERSION=${{ needs.version.outputs.version }}

      - name: build
        run: cmake --build build -j$(nproc)

      # Cheap, and it is the last chance to catch a broken parser before the
      # package is published.
      - name: test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: package
        working-directory: build
        run: cpack -G DEB

      - name: check the package installs
        run: |
          set -euo pipefail
          deb=$(ls build/*.deb)
          dpkg -I "$deb"
          apt-get install -y "./$deb"
          test -x /usr/bin/sqt
          test -d /usr/share/sqt/scripts
          test -d /usr/share/sqt/decor
          sqt --version

      - uses: actions/upload-artifact@v6
        with:
          name: deb
          path: build/*.deb
          if-no-files-found: error

  # ----------------------------------------------------------- AppImage ------
  # The portable linux build: one file, chmod +x, no root, no package manager.
  # Same 22.04 container, so the glibc it needs is old enough to be everywhere,
  # but with Qt 6.8 bundled inside the image - here nothing has to agree with
  # the host's packages, so the newer Qt is free (and gets the dark theme
  # detection, which needs 6.5+).
  linux-appimage:
    needs: version
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file ca-certificates \
            curl git python3-pip patchelf \
            libgl1-mesa-dev libpq-dev unixodbc-dev libssl-dev \
            libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxext6 libxfixes3 \
            libxi6 libxrender1 libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-keysyms1 \
            libxcb-image0 libxcb-shm0 libxcb-icccm4 libxcb-sync1 libxcb-xfixes0 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-util1 \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libegl1

      - uses: actions/checkout@v5

      - name: install Qt ${{ env.QT_VERSION }}
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "aqtinstall==3.1.*"
          # No `-m qtdeclarative`: in Qt 6 qtdeclarative is an *archive* of the
          # base package and is installed by default. The module list holds
          # qtcharts, qtmultimedia and the like, so asking for qtdeclarative
          # there fails with "not found while parsing XML of package
          # information".
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O /opt/qt
          qt_root="/opt/qt/$QT_VERSION/gcc_64"
          # Qml is what the meta-comment parser uses. Checked here so that a
          # reshuffle of Qt's archives fails on this step, with the list of what
          # the version does offer, instead of surfacing later as a puzzling
          # configure error.
          if [ ! -f "$qt_root/lib/cmake/Qt6Qml/Qt6QmlConfig.cmake" ]; then
            echo "Qt6Qml is missing from $qt_root" >&2
            python3 -m aqt list-qt linux desktop --archives "$QT_VERSION" linux_gcc_64 || true
            exit 1
          fi
          echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"

      - name: configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSQT_VERSION=${{ needs.version.outputs.version }}

      - name: build
        run: cmake --build build -j$(nproc)

      - name: test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      # linuxdeploy fills AppDir with the binary's shared libraries, and its qt
      # plugin adds the Qt plugins (platforms, imageformats, ...) that nothing
      # links against directly and so nothing else would find.
      - name: build the AppImage
        run: |
          set -euo pipefail
          DESTDIR=$PWD/AppDir cmake --install build
          cd "$RUNNER_TEMP"
          base=https://github.com/linuxdeploy
          curl -fsSLO $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSLO $base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          cd "$GITHUB_WORKSPACE"
          # No fuse in a container, so the tools unpack themselves instead.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          export PATH="$RUNNER_TEMP:$QT_ROOT/bin:$PATH"
          export QMAKE="$QT_ROOT/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT/lib"
          export OUTPUT=sqt-${{ needs.version.outputs.version }}-x86_64.AppImage
          linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage
          ls -la "$OUTPUT"

      - name: check the AppImage runs
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          chmod +x sqt-*.AppImage
          QT_QPA_PLATFORM=offscreen ./sqt-*.AppImage --version

      - uses: actions/upload-artifact@v6
        with:
          name: appimage
          path: sqt-*.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------ windows ------
  # Portable zip: sqt.exe with the Qt dlls and plugins windeployqt gathers, the
  # libpq dlls from vcpkg, the msvc runtime, and decor/scripts next to it.
  #
  # No developer-command-prompt step: `configure` below leaves the generator
  # unset, so cmake uses the Visual Studio generator, and that one finds the
  # toolchain through MSBuild rather than by reading INCLUDE/LIB out of the
  # environment. Setting up that environment was all ilammy/msvc-dev-cmd did
  # here, so it went - which also settles the last of the Node 20 warnings,
  # since that action is unmaintained and has no node24 release to move to.
  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: install Qt ${{ env.QT_VERSION }}
        run: |
          set -euo pipefail
          pip install "aqtinstall==3.1.*"
          # See the AppImage job: qtdeclarative is not a Qt 6 module name.
          python -m aqt install-qt windows desktop "$QT_VERSION" win64_msvc2022_64 -O C:/Qt
          qt_root="C:/Qt/$QT_VERSION/msvc2022_64"
          if [ ! -f "$qt_root/lib/cmake/Qt6Qml/Qt6QmlConfig.cmake" ]; then
            echo "Qt6Qml is missing from $qt_root" >&2
            python -m aqt list-qt windows desktop --archives "$QT_VERSION" win64_msvc2022_64 || true
            exit 1
          fi
          # Forward slashes for cmake, which reads a backslash as an escape...
          echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"
          # ...and a native path for PATH, which is read by windows itself.
          # Qt's bin holds windeployqt, and the dlls the test binaries load when
          # ctest runs them. Neither is found without it.
          cygpath -w "$qt_root/bin" >> "$GITHUB_PATH"


      # libpq. The runner ships a vcpkg checkout already, so this only builds
      # the port - and only when the cache below misses.
      - name: cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}

      - name: configure
        run: |
          set -euo pipefail
          # cygpath, because $VCPKG_INSTALLATION_ROOT arrives with backslashes
          # and cmake reads those as escapes.
          toolchain="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DCMAKE_INSTALL_PREFIX=install \
            -DSQT_VERSION=${{ needs.version.outputs.version }}

      - name: build
        run: cmake --build build --config Release -j

      - name: test
        run: ctest --test-dir build --build-config Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: package
        working-directory: build
        run: cpack -G ZIP -C Release

      # What makes the difference between "the build passed" and "the program
      # starts": windeployqt not finding Qt, or vcpkg's dlls not being copied,
      # produces a perfectly well-formed archive that cannot run.
      #
      # Judged in both directions. Absent files are the failure that matters,
      # but unexpected ones are how the archive grew to ~90 files and 30-odd
      # spare MB in the first place - an app-local Universal CRT, Qt Quick and
      # the D3D12 shader compiler pulled in by QML debugger plugins, PostgreSQL's
      # ecpg libraries - none of which anything here loads. Every one of those
      # arrived quietly, because a check that only looks for what it needs
      # cannot see them.
      - name: check the archive
        timeout-minutes: 5
        working-directory: build
        run: |
          set -euo pipefail
          zip=$(ls sqt-*-windows-x64.zip)
          mkdir -p check
          cd check
          # cmake rather than unzip: it is certainly installed, and git bash's
          # tar does not read zip files.
          cmake -E tar xf "../$zip"
          root=$(ls -d sqt-*-windows-x64)

          echo "== archive contents"
          du -sh "$root"
          (cd "$root" && find . -type f | sort)
          echo

          missing=
          for f in sqt.exe Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Qml.dll \
                   Qt6Network.dll Qt6Svg.dll \
                   platforms/qwindows.dll styles/qmodernwindowsstyle.dll \
                   iconengines/qsvgicon.dll imageformats/qsvg.dll \
                   imageformats/qico.dll libpq.dll decor scripts \
                   LICENSE README.md; do
            if [ ! -e "$root/$f" ]; then
              echo "missing from the archive: $f" >&2
              missing=1
            fi
          done

          # Anything outside decor/ and scripts/ has to be named here. The
          # patterns cover what legitimately varies: libpq's dependencies are
          # named differently from one vcpkg version to the next, and the MSVC
          # runtime's file set moves with the runner's Visual Studio.
          unexpected=
          while read -r f; do
            case "$f" in
              ./decor/*|./scripts/*) ;;
              ./sqt.exe|./LICENSE|./README.md) ;;
              ./Qt6Core.dll|./Qt6Gui.dll|./Qt6Widgets.dll) ;;
              ./Qt6Qml.dll|./Qt6Network.dll|./Qt6Svg.dll) ;;
              ./platforms/qwindows.dll|./styles/*.dll) ;;
              ./iconengines/qsvgicon.dll) ;;
              ./imageformats/qsvg.dll|./imageformats/qico.dll) ;;
              ./libpq.dll) ;;
              # libpq's dependencies: openssl, zlib, lz4, zstd, and openssl's
              # optional legacy provider.
              ./libcrypto-*.dll|./libssl-*.dll|./legacy.dll) ;;
              ./z.dll|./zlib1.dll|./lz4.dll|./zstd.dll) ;;
              # the MSVC runtime, without the app-local UCRT
              ./msvcp140*.dll|./vcruntime140*.dll) ;;
              *)
                echo "unexpected in the archive: $f" >&2
                unexpected=1
                ;;
            esac
          done < <(cd "$root" && find . -type f)

          if [ -n "$unexpected" ]; then
            echo >&2
            echo "Each file in the archive has to be something the program" >&2
            echo "loads. If the ones above are needed, add them to this" >&2
            echo "check; if not, add them to SQT_DEPLOY_JUNK or to" >&2
            echo "VCPKG_DLL_EXCLUDE in CMakeLists.txt." >&2
          fi
          # An explicit exit, not `[ -z "$missing" ] && [ -z "$unexpected" ]`:
          # set -e ignores a failure inside an && list (only its last command
          # counts), so that spelling would report success on a bad archive.
          if [ -n "$missing" ] || [ -n "$unexpected" ]; then
            exit 1
          fi

          # Runs the unpacked copy, so a dll left behind shows up here rather
          # than on someone's desktop. A gui subsystem binary prints nothing
          # visible, hence only the exit code is judged. This is also what
          # proves the pruning went no further than it should have: a plugin
          # removed by mistake fails here, not on a user's machine.
          "./$root/sqt.exe" --version
          echo "the unpacked binary starts"

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: build/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------ release ------
  release:
    needs: [version, linux-deb, linux-appimage, windows]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" \
            --title "sqt ${{ needs.version.outputs.version }}" \
            --generate-notes \
            artifacts/*
